version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      - VITE_FINNHUB_TOKEN=${VITE_FINNHUB_TOKEN}
      - VITE_GNEWS_KEY=${VITE_GNEWS_KEY}
      - VITE_NEWSAPI_KEY=${VITE_NEWSAPI_KEY}
      - VITE_MEDIASTACK_KEY=${VITE_MEDIASTACK_KEY}
      - VITE_CTX_NEWS_KEY=${VITE_CTX_NEWS_KEY}
      - VITE_CTX_NEWS_HOST=${VITE_CTX_NEWS_HOST}
    container_name: tawfir-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - tawfir-network

networks:
  tawfir-network:
    driver: bridge
